name: ORBIT quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24 runtime)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0 (Node 24 runtime)
        with:
          node-version: '22'
          cache: npm
      - name: Classify PR diff (unknown or code changes run full checks)
        id: scope
        run: node scripts/ci-change-scope.mjs
      - name: Install from lockfile
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run lint
      - name: Unit tests
        if: steps.scope.outputs.docs_only != 'true'
        run: npm test
      - name: Preserve original V6 source integrity
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run verify:source
      - name: Build static distribution
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run build
      - name: Verify handoff files
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run verify:structure
      - name: Check browser/build credential signatures
        if: steps.scope.outputs.docs_only != 'true'
        run: python scripts/check_secrets.py
      - name: Install browser test tooling
        if: steps.scope.outputs.docs_only != 'true'
        run: python -m pip install -r tests/requirements-browser.txt
      - name: Install isolated Chromium
        if: steps.scope.outputs.docs_only != 'true'
        # The hosted Ubuntu image supplies browser libraries. Avoid a redundant
        # apt/font install; keep Playwright's matching bundled browser download.
        run: python -m playwright install chromium
      - name: Real-origin browser regressions
        if: steps.scope.outputs.docs_only != 'true'
        env:
          ORBIT_BROWSER_BUNDLED: '1'
        run: python tests/qa_m1.py
      - name: Cloud UI integration (mocked SDK)
        if: steps.scope.outputs.docs_only != 'true'
        env:
          ORBIT_BROWSER_BUNDLED: '1'
        run: python tests/qa_m2.py
      - name: Motion, touch and reduced-motion regressions
        if: steps.scope.outputs.docs_only != 'true'
        env:
          ORBIT_BROWSER_BUNDLED: '1'
        run: python tests/qa_m25.py
      - name: Private-cloud recovery, undo and legacy preservation
        if: steps.scope.outputs.docs_only != 'true'
        env:
          ORBIT_BROWSER_BUNDLED: '1'
        run: python tests/qa_m2_closeout.py
      - name: Retain synthetic browser evidence
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-browser-evidence
          path: |
            qa/m1-*.png
            qa/m1-results.json
            qa/bp06-*.png
            qa/bp06-results.json
            qa/sp01b-*.png
            qa/sp01b-results.json
            qa/pj02a-*.png
            qa/pj02a-results.json
            qa/m25-*.png
            qa/m25-results.json
            qa/m2-results.json
            qa/m2-closeout-results.json
            test-results/
          retention-days: 7
# No deployment or database migration. Automatic Vercel deployments disabled pending approval.
