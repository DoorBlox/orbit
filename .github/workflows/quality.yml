name: ORBIT quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24 runtime)
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0 (Node 24 runtime)
        with:
          node-version: '22'
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Preserve original V6 source integrity
        run: npm run verify:source
      - name: Build static distribution
        run: npm run build
      - name: Verify handoff files
        run: npm run verify:structure
# No deployment or DB migration in CI; Vercel Git Integration handles previews after user setup.
