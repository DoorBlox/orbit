name: ORBIT quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24 runtime)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0 (Node 24 runtime)
        with:
          node-version: '22'
          cache: npm
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Preserve original V6 source integrity
        run: npm run verify:source
      - name: Build static distribution
        run: npm run build
      - name: Verify handoff files
        run: npm run verify:structure
      - name: Install browser test tooling
        run: python -m pip install -r tests/requirements-browser.txt
      - name: Install isolated Chromium
        # The hosted Ubuntu image supplies browser libraries. Avoid a redundant
        # apt/font install; keep Playwright's matching bundled browser download.
        run: python -m playwright install chromium
      - name: Real-origin browser regressions
        env:
          ORBIT_BROWSER_BUNDLED: '1'
        run: python tests/qa_m1.py
      - name: Cloud UI integration (mocked SDK)
        env:
          ORBIT_BROWSER_BUNDLED: '1'
        run: python tests/qa_m2.py
      - name: Motion, touch and reduced-motion regressions
        env:
          ORBIT_BROWSER_BUNDLED: '1'
        run: python tests/qa_m25.py
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-browser-evidence
          path: |
            qa/m1-*.png
            qa/m1-results.json
            qa/m25-*.png
            qa/m25-results.json
            test-results/
          retention-days: 7
# No deployment or database migration. Automatic Vercel deployments disabled pending approval.
