name: ORBIT 2.2 anonymous sign-in boundary and deployment protection smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unauthenticated-protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Node 22 (no application code or external dependencies)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'

      - name: Verify canonical sign-in shell while raw deployments and Previews remain protected
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const canonical='https://orbit.starscene.com/';
          const protectedTargets=[
            // Pin the real current raw Production deployment; review on every promotion.
            ['live-2.4-production-raw','https://orbit-684anrkjf-doorbloxs-projects.vercel.app/'],
            ['historic-2.2-production-raw','https://orbit-bq6xvk5gr-doorbloxs-projects.vercel.app/'],
            ['historic-2.2-preview','https://orbit-scl8stgne-doorbloxs-projects.vercel.app/']
          ];
          const get=async url=>fetch(url,{
            method:'GET',redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(12000)
          });
          let failures=0;
          const check=(label,passed,status,detail='')=>{
            console.log(JSON.stringify({target:label,status,result:passed?'PASS':'FAIL',detail}));
            if(!passed)failures++;
          };
          for(const [label,url] of protectedTargets){
            try{
              const response=await get(url);
              let protectedResponse=[401,403].includes(response.status);
              if([301,302,303,307,308].includes(response.status)){
                const location=response.headers.get('location');
                if(location){
                  const u=new URL(location,url);
                  protectedResponse=u.protocol==='https:'&&(
                    u.hostname==='vercel.com'||u.hostname.endsWith('.vercel.com')||
                    (u.origin===new URL(url).origin&&/auth|login|sso|_vercel/i.test(u.pathname))
                  );
                }
              }
              check(label,protectedResponse,response.status,protectedResponse?'authentication required':'unexpected unprotected deployment');
            }catch{
              check(label,false,null,'network failure');
            }
          }
          try{
            const response=await get(canonical);
            const csp=response.headers.get('content-security-policy')||'';
            const body=response.status===200?(await response.text()).slice(0,200000):'';
            const validShell=response.status===200&&
              /<div id="app"/.test(body)&&/src\/bootstrap\.js/.test(body)&&
              csp.includes("default-src 'self'")&&
              csp.includes("script-src 'self'")&&
              csp.includes("frame-ancestors 'none'")&&
              csp.includes("object-src 'none'")&&
              csp.includes('https://ixfgavgtwuzdgucjriec.supabase.co');
            check('public-canonical-sign-in-shell',validShell,response.status,
              validShell?'shell present, restrictive CSP':'shell or CSP unexpectedly missing');
            if(validShell){
              const configResponse=await get(canonical+'src/runtime-config.js');
              const text=configResponse.status===200?await configResponse.text():'';
              const match=text.match(/^export const runtimeConfig = (.+);$/m);
              let cfg=null;
              try{cfg=JSON.parse(match?.[1]||'null');}catch{}
              const validConfig=!!cfg&&cfg.siteUrl===canonical&&
                cfg.supabaseUrl==='https://ixfgavgtwuzdgucjriec.supabase.co'&&
                cfg.publicRelease===false&&
                typeof cfg.publishableKey==='string'&&!cfg.publishableKey.startsWith('sb_secret_');
              check('canonical-public-runtime-config',validConfig,configResponse.status,
                validConfig?'exact canonical Supabase Auth config':'invalid or missing public config');
            }
          }catch{
            check('public-canonical-sign-in-shell',false,null,'network failure');
          }
          try{
            const response=await get('https://orbit.allintime.space/');
            const location=response.headers.get('location');
            const redirect=location?new URL(location,'https://orbit.allintime.space/'):null;
            check('secondary-canonical-redirect',
              [301,302,303,307,308].includes(response.status)&&
              redirect?.origin===new URL(canonical).origin,
              response.status,'must redirect to canonical');
          }catch{
            check('secondary-canonical-redirect',false,null,'network failure');
          }
          if(failures){
            console.error('ORBIT 2.2 public sign-in/protected deployment boundary failed.');
            process.exitCode=1;
          }
          NODE

# Read-only unauthenticated HTTP smoke against exact ORBIT-owned endpoints.
# A 200 HTML shell is EXPECTED on the public custom Production domain.
# Supabase tenant RLS protects private records; this check cannot replace
# real bearer-token isolation tests or browser rendering checks.
# Raw Production deployment URLs and Preview deployments must remain Vercel protected.
# Never print user session state, publishable keys, access tokens or private data.
