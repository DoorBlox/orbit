# TEMPORARY, READ-ONLY: resolve the reviewed official editor dependencies once.
# This file will be REMOVED before opening the final EX-01 source PR.
name: EX-01 temporary locked dependency resolution
on:
  push:
    branches:
      - feat/ex01-official-excalidraw-react-island-20261109
permissions:
  contents: read
jobs:
  resolve-official-excalidraw-lock:
    if: github.repository == 'DoorBlox/orbit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout baseline without authorizing writes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve exact pinned packages without installing lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact react@19.3.1 react-dom@19.3.1 @excalidraw/excalidraw@0.18.1
          node -e "const x=require('./package-lock.json'); if(x.packages[''].dependencies['@excalidraw/excalidraw']!=='0.18.1'||x.packages[''].dependencies.react!=='19.3.1'||x.packages[''].dependencies['react-dom']!=='19.3.1')process.exit(1)"
          sha256sum package-lock.json
      - name: Output public dependency lock for reproducible review
        run: |
          echo __ORBIT_EX01_LOCK_BEGIN__
          base64 -w 0 package-lock.json | fold -w 1800
          echo __ORBIT_EX01_LOCK_END__
